name: Diagnose Azure email

on:
  workflow_dispatch:
  push:
    branches:
      - devel
    paths:
      - scripts/diagnose_acs_email.py
      - .github/workflows/diagnose-email.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ACS SDK
        run: pip install azure-communication-email==1.0.0

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Probe ACS send
        run: python scripts/diagnose_acs_email.py
